<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Panel Admin</title>

<style>
:root{
  --bg:#252a33;
  --panel:#272d37;
  --card:#303640;
  --border:#3b424d;
  --line:#4a5059;
  --text:#fff;
  --muted:rgba(255,255,255,.56);
  --faint:rgba(255,255,255,.28);
  --cyan:#00f0ff;
  --green:#42d66f;
  --red:#ff7f7f;
  --yellow:#ffd166;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:24px;
}

button{
  font:inherit;
}

.app{
  width:min(1180px,100%);
  min-height:calc(100vh - 48px);
  margin:auto;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 18px 55px rgba(0,0,0,.24);
}

.header{
  padding:12px;
  border-bottom:1px solid var(--line);
}

.header-box{
  background:#2d333d;
  border:1px solid var(--border);
  border-radius:11px;
  padding:10px 12px;
  text-align:center;
  font-size:13px;
  font-weight:700;
  letter-spacing:.2px;
  color:var(--cyan);
}

.content{
  padding:34px;
}

.panel-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:22px;
}

.panel-title{
  font-size:25px;
  font-weight:800;
}

.panel-subtitle{
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

.panel-grid{
  display:grid;
  grid-template-columns:340px minmax(0,1fr);
  gap:14px;
}

.control-card,
.alerts-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:19px;
}

.control-card{
  min-height:600px;
}

.alerts-card{
  min-width:0;
  min-height:600px;
  display:flex;
  flex-direction:column;
}

.card-title{
  font-size:14px;
  font-weight:800;
}

.card-text{
  margin-top:7px;
  color:var(--muted);
  font-size:10px;
  line-height:1.6;
}

/* BLOQUEO */

.lock-row{
  margin-top:22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.lock-title{
  font-size:15px;
  font-weight:800;
}

.lock-sub{
  margin-top:4px;
  color:var(--muted);
  font-size:10px;
}

.switch{
  position:relative;
  width:62px;
  height:34px;
  flex:0 0 auto;
}

.switch input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.slider{
  position:absolute;
  inset:0;
  cursor:pointer;
  border-radius:999px;
  background:#454c57;
  transition:.18s ease;
}

.slider::before{
  content:"";
  position:absolute;
  width:26px;
  height:26px;
  left:4px;
  top:4px;
  border-radius:50%;
  background:#fff;
  transition:.18s ease;
}

.switch input:checked + .slider{
  background:var(--cyan);
}

.switch input:checked + .slider::before{
  transform:translateX(28px);
}

.state{
  margin-top:17px;
  background:#252a33;
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
}

.state-line{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  font-weight:700;
}

.state-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#68707b;
}

.state-dot.on{
  background:var(--green);
  box-shadow:0 0 8px rgba(66,214,111,.35);
}

.details{
  margin-top:7px;
  color:var(--muted);
  font-size:9px;
  line-height:1.55;
}

.status{
  min-height:18px;
  margin-top:12px;
  color:var(--faint);
  font-size:10px;
  line-height:1.45;
}

.status.error{
  color:var(--red);
}

.status.success{
  color:var(--green);
}

/* ALERTAS */

.alerts-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:12px;
}

.alerts-title{
  font-size:14px;
  font-weight:800;
}

.alerts-sub{
  margin-top:5px;
  color:var(--muted);
  font-size:10px;
}

.alert-count{
  flex:0 0 auto;
  min-width:30px;
  text-align:center;
  padding:5px 8px;
  border-radius:999px;
  background:#352024;
  border:1px solid #5b2c32;
  color:#ff8585;
  font-size:10px;
  font-weight:800;
}

.alerts-list{
  flex:1;
  min-height:500px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:9px;
  padding-right:4px;
}

.alert{
  background:#252a33;
  border:1px solid var(--border);
  border-left:4px solid var(--red);
  border-radius:9px;
  padding:13px;
}

.alert.low{
  border-left-color:var(--cyan);
}

.alert.medium{
  border-left-color:var(--yellow);
}

.alert.high{
  border-left-color:var(--red);
}

.alert.critical{
  border-left-color:#ff304c;
}

.alert-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:7px;
}

.alert-name{
  font-size:12px;
  font-weight:800;
}

.alert-severity{
  padding:4px 7px;
  border-radius:999px;
  border:1px solid var(--border);
  background:#1c2026;
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
}

.alert-users{
  color:var(--muted);
  font-size:10px;
  margin-bottom:9px;
}

.alert-message{
  background:#1c2026;
  border:1px solid #343a43;
  border-radius:7px;
  padding:10px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:11px;
  margin-bottom:9px;
}

.alert-info{
  color:rgba(255,255,255,.72);
  font-size:10px;
  line-height:1.5;
}

.alert-meta{
  margin-top:8px;
  color:var(--faint);
  font-size:9px;
}

.empty{
  flex:1;
  min-height:500px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:var(--muted);
  font-size:11px;
  border:1px dashed var(--line);
  border-radius:9px;
  padding:25px;
}

.footer{
  margin-top:20px;
  padding-top:17px;
  border-top:1px solid var(--line);
  color:var(--faint);
  font-size:9px;
  text-align:center;
}

@media(max-width:820px){

  body{
    padding:12px;
  }

  .app{
    min-height:calc(100vh - 24px);
  }

  .content{
    padding:22px 18px;
  }

  .panel-top{
    flex-direction:column;
    gap:11px;
  }

  .panel-grid{
    grid-template-columns:1fr;
  }

  .control-card,
  .alerts-card{
    min-height:500px;
  }

  .alerts-list,
  .empty{
    min-height:380px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="header-box">
      PANEL ADMIN
    </div>
  </div>

  <div class="content">

    <section id="panelScreen">

      <div class="panel-top">

        <div>
          <div class="panel-title">
            Panel Admin
          </div>

          <div class="panel-subtitle">
            Administración central
          </div>
        </div>

      </div>


      <div class="panel-grid">

        <!-- CONTROL -->

        <div class="control-card">

          <div class="card-title">
            Control del ecosistema
          </div>

          <div class="card-text">
            Control del bloqueo por ubicación.
          </div>


          <div class="lock-row">

            <div>

              <div
                id="lockTitle"
                class="lock-title"
              >
                Desactivado
              </div>

              <div
                id="lockSub"
                class="lock-sub"
              >
                Servicios disponibles.
              </div>

            </div>


            <label class="switch">

              <input
                id="lockSwitch"
                type="checkbox"
              >

              <span class="slider"></span>

            </label>

          </div>


          <div class="state">

            <div class="state-line">

              <span
                id="stateDot"
                class="state-dot"
              ></span>

              <span id="stateText">
                Desactivado
              </span>

            </div>

            <div
              id="details"
              class="details"
            >
              Radio: 100 m
            </div>

          </div>


          <div
            id="panelStatus"
            class="status"
          ></div>

        </div>


        <!-- MODERACIÓN -->

        <div class="alerts-card">

          <div class="alerts-head">

            <div>

              <div class="alerts-title">
                Alertas de moderación
              </div>

              <div class="alerts-sub">
                Avisos detectados automáticamente
              </div>

            </div>


            <div
              id="alertCount"
              class="alert-count"
            >
              0
            </div>

          </div>


          <div
            id="alertsList"
            class="alerts-list"
          >

            <div class="empty">
              Cargando alertas...
            </div>

          </div>

        </div>

      </div>


      <div class="footer">
        Panel Admin
      </div>

    </section>

  </div>

</div>


<script>

/* =========================================================
   URLS
========================================================= */

const API =
  "https://programs-sweet-limited-files.trycloudflare.com";

const MODERATION_API =
  "https://TU-MODERATION-URL.trycloudflare.com";

const RADIUS_METERS = 100;


/* =========================================================
   ELEMENTOS
========================================================= */

const lockSwitch =
  document.getElementById("lockSwitch");

const lockTitle =
  document.getElementById("lockTitle");

const lockSub =
  document.getElementById("lockSub");

const stateDot =
  document.getElementById("stateDot");

const stateText =
  document.getElementById("stateText");

const details =
  document.getElementById("details");

const panelStatus =
  document.getElementById("panelStatus");

const alertsList =
  document.getElementById("alertsList");

const alertCount =
  document.getElementById("alertCount");


let currentState = {
  enabled:false,
  radius_meters:RADIUS_METERS
};


/* =========================================================
   ESTADO
========================================================= */

async function loadState(){

  try{

    const response =
      await fetch(
        API + "/api/ecosystem-lock",
        {
          cache:"no-store"
        }
      );


    const data =
      await response
        .json()
        .catch(() => ({}));


    if(!response.ok){

      throw new Error(
        data.detail ||
        "No se pudo obtener el estado."
      );
    }


    currentState = {

      enabled:
        !!data.enabled,

      radius_meters:
        data.radius_meters ||
        RADIUS_METERS

    };


    updateUI();


  }catch(error){

    setStatus(
      error.message ||
      "No se pudo conectar con el servidor.",
      "error"
    );
  }
}


/* =========================================================
   UI
========================================================= */

function updateUI(){

  const enabled =
    !!currentState.enabled;


  lockSwitch.checked =
    enabled;


  lockTitle.textContent =
    enabled
      ? "Activado"
      : "Desactivado";


  lockSub.textContent =
    enabled
      ? "El bloqueo está activo."
      : "Servicios disponibles.";


  stateText.textContent =
    enabled
      ? "Bloqueo activado"
      : "Desactivado";


  stateDot.className =
    enabled
      ? "state-dot on"
      : "state-dot";


  details.textContent =
    `Radio: ${currentState.radius_meters || RADIUS_METERS} m`;
}


/* =========================================================
   UBICACIÓN
========================================================= */

function getCurrentLocation(){

  return new Promise(
    (resolve,reject)=>{

      if(!navigator.geolocation){

        reject(
          new Error(
            "Este navegador no admite geolocalización."
          )
        );

        return;
      }


      navigator.geolocation.getCurrentPosition(

        position => {

          resolve({

            latitude:
              position.coords.latitude,

            longitude:
              position.coords.longitude

          });

        },

        error => {

          let message =
            "No se pudo obtener tu ubicación.";


          if(
            error.code ===
            error.PERMISSION_DENIED
          ){

            message =
              "Debes permitir el acceso a la ubicación.";

          }else if(
            error.code ===
            error.POSITION_UNAVAILABLE
          ){

            message =
              "La ubicación no está disponible.";

          }else if(
            error.code ===
            error.TIMEOUT
          ){

            message =
              "La ubicación tardó demasiado.";

          }


          reject(
            new Error(message)
          );
        },

        {
          enableHighAccuracy:true,
          timeout:15000,
          maximumAge:0
        }
      );
    }
  );
}


/* =========================================================
   BLOQUEO
========================================================= */

async function setLock(
  enabled
){

  lockSwitch.disabled =
    true;


  try{

    let latitude =
      null;

    let longitude =
      null;


    if(enabled){

      setStatus(
        "Obteniendo ubicación..."
      );


      const location =
        await getCurrentLocation();


      latitude =
        location.latitude;

      longitude =
        location.longitude;
    }


    setStatus(
      enabled
        ? "Activando bloqueo..."
        : "Desactivando bloqueo..."
    );


    const response =
      await fetch(
        API + "/api/ecosystem-lock",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            enabled:
              !!enabled,

            latitude,

            longitude

          })
        }
      );


    const data =
      await response
        .json()
        .catch(() => ({}));


    if(!response.ok){

      throw new Error(
        data.detail ||
        "No se pudo cambiar el estado."
      );
    }


    currentState = {

      enabled:
        !!data.enabled,

      radius_meters:
        data.radius_meters ||
        RADIUS_METERS

    };


    updateUI();


    setStatus(
      enabled
        ? "Bloqueo activado correctamente."
        : "Bloqueo desactivado correctamente.",
      "success"
    );


  }catch(error){

    updateUI();

    setStatus(
      error.message ||
      "No se pudo cambiar el estado.",
      "error"
    );

  }finally{

    lockSwitch.disabled =
      false;
  }
}


/* =========================================================
   ALERTAS
========================================================= */

async function loadModerationAlerts(){

  try{

    const response =
      await fetch(
        MODERATION_API +
        "/api/moderation/alerts",
        {
          cache:"no-store"
        }
      );


    const data =
      await response
        .json()
        .catch(() => ({}));


    if(!response.ok){

      throw new Error(
        data.detail ||
        `Moderation API respondió ${response.status}.`
      );
    }


    const alerts =
      Array.isArray(data)
        ? data
        : Array.isArray(data.alerts)
          ? data.alerts
          : [];


    renderAlerts(
      alerts
    );


  }catch(error){

    alertCount.textContent =
      "0";


    alertsList.innerHTML =
      "";


    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "empty";

    empty.textContent =
      error.message ||
      "No se pudieron cargar las alertas.";

    alertsList.appendChild(
      empty
    );
  }
}


/* =========================================================
   MOSTRAR ALERTAS
========================================================= */

function renderAlerts(
  alerts
){

  alertCount.textContent =
    alerts.length;


  if(!alerts.length){

    alertsList.innerHTML =
      "";


    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "empty";

    empty.textContent =
      "No hay alertas de moderación.";

    alertsList.appendChild(
      empty
    );

    return;
  }


  alertsList.innerHTML =
    "";


  for(
    const alert of alerts
  ){

    const severity =
      String(
        alert.severity ||
        "medium"
      ).toLowerCase();


    const card =
      document.createElement(
        "div"
      );

    card.className =
      `alert ${severity}`;


    const top =
      document.createElement(
        "div"
      );

    top.className =
      "alert-top";


    const name =
      document.createElement(
        "div"
      );

    name.className =
      "alert-name";

    name.textContent =
      "⚠ Contenido detectado";


    const severityBox =
      document.createElement(
        "div"
      );

    severityBox.className =
      "alert-severity";

    severityBox.textContent =
      severity;


    top.appendChild(
      name
    );

    top.appendChild(
      severityBox
    );


    const users =
      document.createElement(
        "div"
      );

    users.className =
      "alert-users";

    users.textContent =
      `@${alert.sender || "desconocido"} → @${alert.receiver || "desconocido"}`;


    const message =
      document.createElement(
        "div"
      );

    message.className =
      "alert-message";

    message.textContent =
      `"${alert.message || "(sin texto)"}"`;


    const info =
      document.createElement(
        "div"
      );

    info.className =
      "alert-info";


    const category =
      document.createElement(
        "div"
      );

    category.textContent =
      `Categoría: ${alert.category || "other"}`;


    const reason =
      document.createElement(
        "div"
      );

    reason.style.marginTop =
      "5px";

    reason.textContent =
      `Motivo: ${alert.reason || "Contenido detectado automáticamente."}`;


    info.appendChild(
      category
    );

    info.appendChild(
      reason
    );


    const meta =
      document.createElement(
        "div"
      );

    meta.className =
      "alert-meta";

    meta.textContent =
      `Modelo: ${alert.model || "Gemini"}${
        alert.created_at
          ? " · " + alert.created_at
          : ""
      }`;


    card.appendChild(
      top
    );

    card.appendChild(
      users
    );

    card.appendChild(
      message
    );

    card.appendChild(
      info
    );

    card.appendChild(
      meta
    );


    alertsList.appendChild(
      card
    );
  }
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  message,
  type=""
){

  panelStatus.textContent =
    message || "";

  panelStatus.className =
    "status";

  if(type){
    panelStatus.classList.add(
      type
    );
  }
}


/* =========================================================
   EVENTOS
========================================================= */

lockSwitch.addEventListener(
  "change",
  event => {

    setLock(
      event.target.checked
    );

  }
);


/* =========================================================
   INICIAR
========================================================= */

loadState();
loadModerationAlerts();


/* =========================================================
   ACTUALIZACIÓN
========================================================= */

setInterval(
  () => {

    loadState();
    loadModerationAlerts();

  },
  5000
);

</script>

</body>
</html>
