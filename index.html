<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin</title>

<style>
:root{
  --bg:#121212;
  --panel:#181818;
  --card:#202020;
  --line:#333;
  --cyan:#00bcd4;
  --cyan2:#00f0ff;
  --green:#42d66f;
  --red:#ff5c67;
  --yellow:#ffd166;
  --text:#f4f4f4;
  --muted:#888;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  min-height:100vh;
}

/* TOP */

.topbar{
  height:62px;
  padding:0 24px;
  border-bottom:1px solid var(--line);
  background:var(--panel);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.top-title{
  font-size:18px;
  font-weight:700;
}

.top-right{
  color:var(--cyan);
  font-size:12px;
  text-shadow:
    0 0 8px rgba(0,240,255,.45);
}

/* MAIN */

main{
  width:100%;
  padding:24px;
}

.container{
  width:100%;
  max-width:1400px;
  margin:auto;
}

.page-title{
  font-size:24px;
  font-weight:700;
  margin-bottom:20px;
  text-shadow:
    0 0 12px rgba(0,240,255,.14);
}

.grid{
  display:grid;
  grid-template-columns:340px minmax(0,1fr);
  gap:18px;
}

/* SECTIONS */

.section{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:5px;
}

.section-title{
  padding:15px 17px;
  border-bottom:1px solid var(--line);
  font-size:14px;
  font-weight:700;
}

.section-body{
  padding:18px;
}

/* LOCK */

.lock-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.lock-name{
  font-size:15px;
  font-weight:700;
}

.lock-state{
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
}

.switch{
  position:relative;
  width:58px;
  height:30px;
  flex:none;
}

.switch input{
  opacity:0;
  width:0;
  height:0;
}

.slider{
  position:absolute;
  inset:0;
  background:#3d3d3d;
  cursor:pointer;
  border-radius:5px;
  transition:.2s;
}

.slider::before{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  left:4px;
  top:4px;
  background:#fff;
  border-radius:3px;
  transition:.2s;
}

.switch input:checked + .slider{
  background:var(--cyan);
  box-shadow:
    0 0 8px rgba(0,240,255,.55),
    0 0 20px rgba(0,240,255,.22);
}

.switch input:checked + .slider::before{
  transform:translateX(28px);
  box-shadow:0 0 10px rgba(255,255,255,.25);
}

.state{
  margin-top:16px;
  color:var(--muted);
  font-size:11px;
}

.state-line{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--text);
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#666;
}

.dot.on{
  background:var(--green);
  box-shadow:
    0 0 7px rgba(66,214,111,.7);
}

.details{
  margin-top:6px;
  color:var(--muted);
  font-size:10px;
}

.status{
  min-height:17px;
  margin-top:12px;
  font-size:10px;
  color:var(--muted);
}

.status.error{
  color:var(--red);
}

.status.success{
  color:var(--green);
  text-shadow:
    0 0 8px rgba(66,214,111,.2);
}

/* ALERTS */

.alerts{
  min-height:620px;
}

.alerts-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.count{
  min-width:28px;
  height:23px;
  padding:0 7px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#311b1e;
  border:1px solid #56272c;
  border-radius:4px;
  color:#ff8585;
  font-size:10px;
  font-weight:700;
  box-shadow:0 0 10px rgba(255,92,103,.08);
}

.alerts-list{
  max-height:560px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.alert{
  background:#242424;
  border-left:3px solid var(--red);
  padding:13px;
  border-radius:3px;
  box-shadow:
    0 0 0 rgba(255,92,103,0);
  transition:.15s;
}

.alert:hover{
  box-shadow:
    0 0 14px rgba(255,92,103,.08);
}

.alert.low{
  border-left-color:var(--cyan);
}

.alert.medium{
  border-left-color:var(--yellow);
}

.alert.high{
  border-left-color:var(--red);
}

.alert.critical{
  border-left-color:#ff304c;
  box-shadow:
    0 0 12px rgba(255,48,76,.09);
}

.alert-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.alert-title{
  font-size:12px;
  font-weight:700;
}

.severity{
  padding:3px 6px;
  border:1px solid #444;
  border-radius:3px;
  background:#1a1a1a;
  font-size:9px;
  text-transform:uppercase;
}

.alert-users{
  margin-top:7px;
  color:var(--muted);
  font-size:10px;
}

.alert-message{
  margin-top:9px;
  padding:10px;
  background:#191919;
  border:1px solid #303030;
  border-radius:3px;
  font-size:11px;
  line-height:1.45;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.alert-info{
  margin-top:8px;
  color:#bdbdbd;
  font-size:10px;
  line-height:1.5;
}

.alert-meta{
  margin-top:7px;
  color:#666;
  font-size:9px;
}

.empty{
  min-height:420px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:var(--muted);
  font-size:11px;
}

/* MOBILE */

@media(max-width:820px){

  .topbar{
    padding:0 15px;
  }

  main{
    padding:15px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .alerts{
    min-height:500px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="topbar">

    <div class="top-title">
      Panel Admin
    </div>

    <div class="top-right">
      Administración
    </div>

  </header>


  <main>

    <div class="container">

      <div class="page-title">
        Panel Admin
      </div>


      <div class="grid">

        <!-- CONTROL -->

        <section class="section">

          <div class="section-title">
            Control del ecosistema
          </div>

          <div class="section-body">

            <div class="lock-row">

              <div>

                <div
                  id="lockTitle"
                  class="lock-name"
                >
                  Desactivado
                </div>

                <div
                  id="lockSub"
                  class="lock-state"
                >
                  Servicios disponibles
                </div>

              </div>


              <label class="switch">

                <input
                  id="lockSwitch"
                  type="checkbox"
                >

                <span class="slider"></span>

              </label>

            </div>


            <div class="state">

              <div class="state-line">

                <span
                  id="stateDot"
                  class="dot"
                ></span>

                <span id="stateText">
                  Desactivado
                </span>

              </div>


              <div
                id="details"
                class="details"
              >
                Radio: 100 m
              </div>

            </div>


            <div
              id="panelStatus"
              class="status"
            ></div>

          </div>

        </section>


        <!-- ALERTAS -->

        <section class="section alerts">

          <div class="section-title">

            <div class="alerts-head">

              <span>
                Alertas de moderación
              </span>

              <span
                id="alertCount"
                class="count"
              >
                0
              </span>

            </div>

          </div>


          <div
            id="alertsList"
            class="section-body alerts-list"
          >

            <div class="empty">
              Cargando alertas...
            </div>

          </div>

        </section>

      </div>

    </div>

  </main>

</div>


<script>

/* =========================================================
   URLS
========================================================= */

const API =
  "https://visitor-built-cells-disable.trycloudflare.com";

const MODERATION_API =
  "https://TU-MODERATION-URL.trycloudflare.com";

const RADIUS_METERS = 100;


/* =========================================================
   ELEMENTOS
========================================================= */

const lockSwitch =
  document.getElementById("lockSwitch");

const lockTitle =
  document.getElementById("lockTitle");

const lockSub =
  document.getElementById("lockSub");

const stateDot =
  document.getElementById("stateDot");

const stateText =
  document.getElementById("stateText");

const details =
  document.getElementById("details");

const panelStatus =
  document.getElementById("panelStatus");

const alertsList =
  document.getElementById("alertsList");

const alertCount =
  document.getElementById("alertCount");


let currentState = {
  enabled:false,
  radius_meters:RADIUS_METERS
};


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  message,
  type=""
){

  panelStatus.textContent =
    message || "";

  panelStatus.className =
    "status";

  if(type){

    panelStatus.classList.add(
      type
    );

  }
}


/* =========================================================
   ESTADO
========================================================= */

async function loadState(){

  try{

    const response =
      await fetch(
        API + "/api/ecosystem-lock",
        {
          cache:"no-store"
        }
      );


    const data =
      await response
        .json()
        .catch(() => ({}));


    if(!response.ok){

      throw new Error(
        data.detail ||
        "No se pudo obtener el estado."
      );
    }


    currentState = {

      enabled:
        !!data.enabled,

      radius_meters:
        data.radius_meters ||
        RADIUS_METERS

    };


    updateUI();

  }catch(error){

    setStatus(
      error.message ||
      "No se pudo conectar con el servidor.",
      "error"
    );

  }
}


/* =========================================================
   UI
========================================================= */

function updateUI(){

  const enabled =
    !!currentState.enabled;


  lockSwitch.checked =
    enabled;


  lockTitle.textContent =
    enabled
      ? "Activado"
      : "Desactivado";


  lockSub.textContent =
    enabled
      ? "El bloqueo está activo"
      : "Servicios disponibles";


  stateText.textContent =
    enabled
      ? "Bloqueo activado"
      : "Desactivado";


  stateDot.className =
    enabled
      ? "dot on"
      : "dot";


  details.textContent =
    `Radio: ${
      currentState.radius_meters ||
      RADIUS_METERS
    } m`;
}


/* =========================================================
   UBICACIÓN
========================================================= */

function getCurrentLocation(){

  return new Promise(
    (resolve,reject)=>{

      if(!navigator.geolocation){

        reject(
          new Error(
            "Este navegador no admite geolocalización."
          )
        );

        return;
      }


      navigator.geolocation.getCurrentPosition(

        position => {

          resolve({

            latitude:
              position.coords.latitude,

            longitude:
              position.coords.longitude

          });

        },

        error => {

          let message =
            "No se pudo obtener tu ubicación.";


          if(
            error.code ===
            error.PERMISSION_DENIED
          ){

            message =
              "Debes permitir el acceso a la ubicación.";

          }else if(
            error.code ===
            error.POSITION_UNAVAILABLE
          ){

            message =
              "La ubicación no está disponible.";

          }else if(
            error.code ===
            error.TIMEOUT
          ){

            message =
              "La ubicación tardó demasiado.";

          }


          reject(
            new Error(message)
          );

        },

        {
          enableHighAccuracy:true,
          timeout:15000,
          maximumAge:0
        }

      );

    }
  );
}


/* =========================================================
   CAMBIAR BLOQUEO
========================================================= */

async function setLock(
  enabled
){

  lockSwitch.disabled =
    true;


  try{

    let latitude = null;
    let longitude = null;


    if(enabled){

      setStatus(
        "Obteniendo ubicación..."
      );


      const location =
        await getCurrentLocation();


      latitude =
        location.latitude;

      longitude =
        location.longitude;

    }


    setStatus(
      enabled
        ? "Activando bloqueo..."
        : "Desactivando bloqueo..."
    );


    const response =
      await fetch(
        API + "/api/ecosystem-lock",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            enabled:
              !!enabled,

            latitude,

            longitude

          })

        }
      );


    const data =
      await response
        .json()
        .catch(() => ({}));


    if(!response.ok){

      throw new Error(
        data.detail ||
        data.message ||
        "No se pudo cambiar el estado."
      );
    }


    currentState = {

      enabled:
        !!data.enabled,

      radius_meters:
        data.radius_meters ||
        RADIUS_METERS

    };


    updateUI();


    setStatus(
      enabled
        ? "Bloqueo activado."
        : "Bloqueo desactivado.",
      "success"
    );


  }catch(error){

    updateUI();


    setStatus(
      error.message ||
      "No se pudo cambiar el estado.",
      "error"
    );


  }finally{

    lockSwitch.disabled =
      false;

  }
}


/* =========================================================
   ALERTAS
========================================================= */

async function loadModerationAlerts(){

  try{

    const response =
      await fetch(
        MODERATION_API +
        "/api/moderation/alerts",
        {
          cache:"no-store"
        }
      );


    const data =
      await response
        .json()
        .catch(() => ({}));


    if(!response.ok){

      throw new Error(
        data.detail ||
        `Moderation API respondió ${response.status}.`
      );

    }


    const alerts =
      Array.isArray(data)
        ? data
        : Array.isArray(data.alerts)
          ? data.alerts
          : [];


    renderAlerts(
      alerts
    );


  }catch(error){

    alertCount.textContent =
      "0";


    alertsList.innerHTML =
      "";


    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "empty";

    empty.textContent =
      error.message ||
      "No se pudieron cargar las alertas.";

    alertsList.appendChild(
      empty
    );
  }
}


/* =========================================================
   RENDER
========================================================= */

function renderAlerts(
  alerts
){

  alertCount.textContent =
    alerts.length;


  if(!alerts.length){

    alertsList.innerHTML =
      "";


    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "empty";

    empty.textContent =
      "No hay alertas de moderación.";

    alertsList.appendChild(
      empty
    );

    return;
  }


  alertsList.innerHTML =
    "";


  for(
    const alert of alerts
  ){

    const severity =
      String(
        alert.severity ||
        "medium"
      ).toLowerCase();


    const card =
      document.createElement(
        "div"
      );

    card.className =
      `alert ${severity}`;


    const top =
      document.createElement(
        "div"
      );

    top.className =
      "alert-top";


    const title =
      document.createElement(
        "div"
      );

    title.className =
      "alert-title";

    title.textContent =
      "⚠ Contenido detectado";


    const severityBox =
      document.createElement(
        "div"
      );

    severityBox.className =
      "severity";

    severityBox.textContent =
      severity;


    top.appendChild(
      title
    );

    top.appendChild(
      severityBox
    );


    const users =
      document.createElement(
        "div"
      );

    users.className =
      "alert-users";

    users.textContent =
      `@${alert.sender || "desconocido"} → @${alert.receiver || "desconocido"}`;


    const message =
      document.createElement(
        "div"
      );

    message.className =
      "alert-message";

    message.textContent =
      `"${alert.message || "(sin texto)"}"`;


    const info =
      document.createElement(
        "div"
      );

    info.className =
      "alert-info";

    info.textContent =
      `Categoría: ${alert.category || "other"} · Motivo: ${alert.reason || "Contenido detectado automáticamente."}`;


    const meta =
      document.createElement(
        "div"
      );

    meta.className =
      "alert-meta";

    meta.textContent =
      `Modelo: ${alert.model || "Gemini"}${
        alert.created_at
          ? " · " + alert.created_at
          : ""
      }`;


    card.appendChild(
      top
    );

    card.appendChild(
      users
    );

    card.appendChild(
      message
    );

    card.appendChild(
      info
    );

    card.appendChild(
      meta
    );


    alertsList.appendChild(
      card
    );
  }
}


/* =========================================================
   INICIO
========================================================= */

lockSwitch.addEventListener(
  "change",
  event => {

    setLock(
      event.target.checked
    );

  }
);


loadState();
loadModerationAlerts();


/* =========================================================
   REFRESH
========================================================= */

setInterval(
  () => {

    loadState();
    loadModerationAlerts();

  },
  5000
);

</script>

</body>
</html>
